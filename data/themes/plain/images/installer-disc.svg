<?xml version="1.0" encoding="UTF-8"?>
<!-- The plain theme's picture for an installer, in the theme installer's drop
     well: a disc, drawn for this project. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.5" stop-color="#d9dee4"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="28" fill="url(#face)" stroke="#a9b2bc" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="11" fill="none" stroke="#c3cad2" stroke-width="1"/>
  <circle cx="32" cy="32" r="7" fill="#ffffff" stroke="#a9b2bc" stroke-width="1"/>
  <circle cx="32" cy="32" r="3" fill="none" stroke="#a9b2bc" stroke-width="1"/>
</svg>
