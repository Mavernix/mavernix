<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="platinum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#c4c4c4"/>
    </linearGradient>
    <pattern id="pinlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <rect y="2" width="100" height="0.8" fill="#ffffff" fill-opacity="0.7"/>
      <rect y="2.8" width="100" height="0.8" fill="#a9a9a9" fill-opacity="0.35"/>
    </pattern>

    <linearGradient id="ocean" x1="1" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#21a681"/>
      <stop offset="0.22" stop-color="#1b8f74"/>
      <stop offset="0.42" stop-color="#206269"/>
      <stop offset="0.58" stop-color="#305f7f"/>
      <stop offset="0.75" stop-color="#295589"/>
      <stop offset="0.9" stop-color="#153a67"/>
      <stop offset="1" stop-color="#0c2b52"/>
    </linearGradient>

    <linearGradient id="aqua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eb3ff"/>
      <stop offset="0.55" stop-color="#2a6fd8"/>
      <stop offset="1" stop-color="#173f9a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soften" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>

    <clipPath id="face"><rect width="100" height="100"/></clipPath>
  </defs>

  <g transform="matrix(0.86 0.5 0 1 42 78)" clip-path="url(#face)">
    <rect width="100" height="100" fill="url(#ocean)"/>
    <path d="M-10 52 C20 56 60 68 110 80 L110 92 C60 80 20 70 -10 66 Z"
          fill="#6f9cc0" fill-opacity="0.35" filter="url(#soften)"/>
  </g>

  <g transform="matrix(0.86 -0.5 0 1 128 128)" clip-path="url(#face)">
    <rect width="100" height="100" fill="url(#aqua)"/>
    <g filter="url(#soften)">
      <path d="M-10 70 C20 40 60 30 110 42 L110 56 C64 44 26 54 -10 84 Z" fill="#ffffff" fill-opacity="0.45"/>
      <path d="M-10 30 C30 12 70 10 110 18 L110 26 C70 18 32 22 -10 40 Z" fill="#cfe9ff" fill-opacity="0.35"/>
      <path d="M-10 96 C30 78 70 74 110 84 L110 92 C72 82 32 88 -10 104 Z" fill="#9fd4ff" fill-opacity="0.35"/>
    </g>
    <path d="M0 0 L100 0 L100 30 C66 40 34 40 0 34 Z" fill="url(#gloss)" fill-opacity="0.6"/>
    <rect width="100" height="100" fill="#000000" fill-opacity="0.18"/>
  </g>

  <g transform="matrix(0.86 0.5 -0.86 0.5 128 28)" clip-path="url(#face)">
    <rect width="100" height="100" fill="url(#platinum)"/>
    <rect width="100" height="100" fill="url(#pinlines)"/>
    <rect x="16" y="16" width="68" height="68" fill="#dcdcdc"/>
    <path d="M16 84 L16 16 L84 16" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M16 84 L84 84 L84 16" fill="none" stroke="#8c8c8c" stroke-width="2"/>
  </g>

  <path d="M42 78 L128 128 L214 78 M128 128 L128 228"
        fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M128 28 L214 78 L214 178 L128 228 L42 178 L42 78 Z"
        fill="none" stroke="#0b1a30" stroke-opacity="0.45" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
