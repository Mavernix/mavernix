[sounds]
# Whether the desktop plays sounds at all.
enabled = true
# The theme names a sound pack (docs/sound-packs.md); to use another:
# pack = "freedesktop"
# Volume change per key press, as a share of full volume.
volume_step = 0.0625

[display]
# Scale factor. "auto" uses 2 on dense screens and 1 elsewhere. Fractions
# work but blur the theme's pictures.
scale = "auto"
# The screen for the panel and dock (default: the first listed):
# main_screen = "eDP-1"
# Per-screen settings, by name (`wlr-randr` lists them):
# [display.screens."HDMI-A-1"]
# scale = 1
# position = "2560,0"

[input]
# Keyboard layouts (xkeyboard-config names), comma-separated with variants
# in matching positions. Left out: the system's (`localectl`).
# keyboard_layout = "us"
# keyboard_variant = "intl"
# Layout switch key: "ctrl_space", "alt_shift", "caps_lock", or "" for none.
keyboard_switch_key = "alt_shift"
tap_to_click = true
natural_scroll = false
# mouse_natural_scroll = false
# Pointer speed, from -1 (slow) to 1 (fast); left out: 0. Acceleration moves
# the pointer further for a faster movement; left out: the device's own.
# mouse_speed = 0.0
# mouse_acceleration = true
# touchpad_speed = 0.0
# touchpad_acceleration = true
# How far a step of the wheel scrolls, times the usual (1); left out: 1.
# mouse_scroll_speed = 1.0
# The primary button on the right, for the left hand; left out: false.
# left_handed = false

