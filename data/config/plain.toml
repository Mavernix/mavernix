# The plain desktop: an ordinary desktop, and the base the other configs
# build on. Keys whose meaning is not obvious are explained here.

theme = "plain"

[window]
button_side = "right"
button_order = ["minimize", "maximize", "close"]
# Double click on a title bar: "maximize" (and back), "minimize" or "none".
title_double_click = "maximize"

# A window dragged to a side takes that half, to a corner that quarter, to
# the top the whole screen. The distances are in pixels from the edge.
snap_to_edges = true
snap_distance = 12
snap_corner_distance = 60
# Held, lets a window be moved (main button) or resized (secondary button)
# from anywhere on it. "" for no such key.
drag_key = "<super>"
# Pixels outside a window's edge that still grab it for resizing. Left out:
# the theme's value.
resize_reach = 8
# Duration of snapping to a half, quarter or the whole screen. Left out: the
# theme's value.
quick_resize_ms = 120
# Tiled windows that touch share their edge: resizing one resizes the
# others along it. With `false`, only the dragged window changes.
shared_edges = true

[gtk]
# Buttons in GTK header bars, which the compositor does not draw. Left out:
# [window]'s values.
button_side = "right"
button_order = ["minimize", "maximize", "close"]
# Draw GTK programs in the theme's look (from the next login).
use_theme = true

[qt]
# Draw Qt programs in the theme's look through Kvantum (from the next login;
# see docs/configuration.md).
use_theme = true

[panel]
position = "top"
left = ["app_name", "menus"]
# Status items (docs/panel-items.md); one with nothing to show takes no room.
right = ["tray", "load", "bluetooth", "network", "volume", "battery", "clock", "search", "notifications", "session"]
quit_label = "Close %1"
clock_format = "HH:mm"
clock_menu_date_format = "d MMMM yyyy"

# The desktop's own menus, shown in the panel while no window is active.
# The first menu opens from the name (Settings, Desktop changes it) and has
# no title of its own. An entry runs
# a `command` (asking first if it has a `confirm` table, as in logo_menu) or
# one of the shell's `action`s: app_grid, window_overview, search,
# notification_list, lock, empty_trash.
[desktop_menus]
name = "Desktop"

[[desktop_menus.menus]]
entries = [
    { label = "About This Computer", command = ["mavernix-about"] },
    { label = "Settings…", command = ["mavernix-settings", "desktop"] },
    { separator = true },
    { label = "Empty Wastebasket…", action = "empty_trash" },
]

[[desktop_menus.menus]]
title = "File"
entries = [
    { label = "New Window", command = ["gio", "open", "~"] },
    { label = "New Folder", command = ["mavernix-file-action", "new-folder", "~/Desktop", "New folder"] },
    { separator = true },
    { label = "Find…", action = "search" },
]

[[desktop_menus.menus]]
title = "Go"
entries = [
    { label = "Home", command = ["gio", "open", "~"] },
    { label = "Desktop", command = ["gio", "open", "~/Desktop"] },
    { label = "Documents", command = ["gio", "open", "~/Documents"] },
    { label = "Downloads", command = ["gio", "open", "~/Downloads"] },
    { label = "Pictures", command = ["gio", "open", "~/Pictures"] },
    { separator = true },
    { label = "Applications", action = "app_grid" },
    { label = "Wastebasket", command = ["gio", "open", "trash:///"] },
]

[[desktop_menus.menus]]
title = "Window"
entries = [
    { label = "All Windows", action = "window_overview" },
]

[status.volume]
# The menu's wording. Without settings_command there is no settings entry.
output_label = "Output Device:"
input_label = "Input Device:"
mute_label = "Mute"
settings_label = "Sound Settings…"
settings_command = ["mavernix-settings", "sound"]

[status.network]
# A network applet whose tray icon is left out, so there is one network
# icon. It keeps running: NetworkManager asks it for saved passwords.
tray_program = "nm-applet"
# "own" for the Wi-Fi menu below, "program" for the applet's menu.
menu = "own"
settings_command = ["mavernix-settings", "network"]
# The menu's wording; %1 is a network's or a cable's name.
on_label = "Wi-Fi: On"
off_label = "Wi-Fi: Off"
turn_on_label = "Turn Wi-Fi On"
turn_off_label = "Turn Wi-Fi Off"
searching_label = "Looking for networks…"
cable_label = "Connected by cable: %1"
join_other_label = "Join Other Network…"
settings_label = "Open Network Preferences…"
password_label = "The Wi-Fi network “%1” requires a password."
wrong_password_label = "The password for “%1” was not accepted. Try again."
password_placeholder = "Password"
join_label = "Join"
cancel_label = "Cancel"

[status.bluetooth]
# The menu's wording.
on_label = "Bluetooth is on"
off_label = "Bluetooth is off"
turn_off_label = "Turn off"
turn_on_label = "Turn on"
devices_label = "Devices"
connect_label = "Connect"
disconnect_label = "Disconnect"
battery_label = "Battery: %1%"
nearby_label = "Nearby Devices"
searching_label = "Searching…"
pairing_label = "%1 (pairing…)"
settings_label = "Bluetooth Settings…"
settings_command = ["mavernix-settings", "bluetooth"]

[status.battery]
show_percentage = true
charged_label = "Charged"
until_full_label = "%1 until full"
remaining_label = "%1 remaining"
on_battery_label = "On battery"
on_adapter_label = "On mains power"
show_percentage_label = "Show percentage"

# A custom item: an icon with a menu of commands, optionally confirmed.
[status.session]
icon = "system-shutdown"
menu = [
    { label = "Settings…", command = ["mavernix-settings"] },
    { separator = true },
    { label = "Suspend", command = ["systemctl", "suspend"] },
    { separator = true },
    { label = "Restart…", command = ["systemctl", "reboot"], confirm = { title = "Restart the computer?", text = "Programs are closed without asking.", button = "Restart", cancel = "Cancel", icon = "system-reboot" } },
    { label = "Switch off…", command = ["systemctl", "poweroff"], confirm = { title = "Switch the computer off?", text = "It switches off by itself in %1 seconds.", button = "Switch off", cancel = "Cancel", icon = "system-shutdown", seconds = 30 } },
    { label = "Log out…", command = ["sh", "-c", "kill \"$DESKTOP_SESSION_PID\""], confirm = { title = "Log out?", text = "Programs are closed without asking.", button = "Log out", cancel = "Cancel", icon = "system-log-out" } },
]

# A custom item showing what a command prints.
[status.load]
command = ["sh", "-c", "cut -d' ' -f1 /proc/loadavg"]
every_seconds = 10

[desktop]
# Background picture: a full path, or a path inside the theme. Empty for
# the theme's own.
picture = ""

# Default programs per file type where the user has chosen none
# (~/.config/mimeapps.list wins). The first installed entry is used; without
# these the system's alphabetical order can open pictures in a web browser.
[[default_programs]]
kinds = ["image/png", "image/jpeg", "image/gif", "image/webp", "image/bmp", "image/tiff", "image/svg+xml", "image/avif", "image/heif"]
programs = ["org.kde.gwenview.desktop", "org.gnome.Loupe.desktop", "org.gnome.eog.desktop", "org.gnome.Shotwell-Viewer.desktop"]

[[default_programs]]
kinds = ["application/pdf"]
programs = ["org.kde.okular.desktop", "org.gnome.Papers.desktop", "org.gnome.Evince.desktop", "org.pwmt.zathura.desktop"]

[[default_programs]]
kinds = ["video/mp4", "video/x-matroska", "video/webm", "video/quicktime", "video/x-msvideo", "video/mpeg", "video/ogg"]
programs = ["mpv.desktop", "org.videolan.VLC.desktop", "vlc.desktop", "io.github.celluloid_player.Celluloid.desktop", "org.kde.haruna.desktop"]

[[default_programs]]
kinds = ["audio/mpeg", "audio/flac", "audio/ogg", "audio/x-wav", "audio/mp4", "audio/x-vorbis+ogg", "audio/opus"]
programs = ["org.kde.elisa.desktop", "org.videolan.VLC.desktop", "vlc.desktop", "mpv.desktop"]

[shortcuts]
# Keys for shell actions, in Wayfire's key syntax.
app_grid = "<super> KEY_A"
window_overview = "<super> KEY_W"
show_desktop = "<super> KEY_D"
close_window = "<alt> KEY_F4"
switch_window = "<alt> KEY_TAB"
# The program switcher; both must use the same held modifier.
switch_program = "<super> KEY_TAB"
switch_program_back = "<super> <shift> KEY_TAB"
minimize_window = "<super> KEY_H"
fullscreen_window = "KEY_F11"
search = "<super> KEY_SPACE"
lock = "<super> KEY_L"
volume_up = "KEY_VOLUMEUP"
volume_down = "KEY_VOLUMEDOWN"
volume_mute = "KEY_MUTE"

# Arrow-key snapping, stepping from where the window is: left/right to a
# half, then up/down to a quarter; up maximizes, down restores or minimizes.
snap_left = "<super> KEY_LEFT"
snap_right = "<super> KEY_RIGHT"
snap_up = "<super> KEY_UP"
snap_down = "<super> KEY_DOWN"
# Unbound by default: tile_left, tile_right, tile_top, tile_bottom,
# tile_top_left, tile_top_right, tile_bottom_left, tile_bottom_right,
# maximize_window, restore_window.
previous_desktop = "<ctrl> <alt> KEY_LEFT"
next_desktop = "<ctrl> <alt> KEY_RIGHT"
# Unbound by default:
# window_to_previous_desktop = "<ctrl> <shift> KEY_LEFT"
# window_to_next_desktop = "<ctrl> <shift> KEY_RIGHT"

[desktops]
# Virtual desktops: how many there are, and the most allowed.
count = 2
most = 16
# A window held at a side moves to the next desktop after this long. Left
# out: never.
drag_to_edge_ms = 900
# Shell parts that stay put while desktops slide: "dock", "panel".
still = ["dock", "panel"]
# Fingers for a sideways touchpad swipe between desktops; 0 for none.
swipe_fingers = 3

[gestures]
# Three- and four-finger swipes and pinches ("in", "out"): an action named
# as under [shortcuts], or { run = ["program", "argument"] }.
swipe_up_3 = "window_overview"
swipe_down_3 = "show_desktop"
pinch_in_4 = "app_grid"

[screenshot]
# Flash the screen when a screenshot is taken (keys under [commands]).
flash = true

[search]
# The panel's search: wording, and the folders searched and how deep.
label = "Search"
applications_label = "Applications"
folders_label = "Folders"
folders = ["~"]
depth = 4
most_of_a_kind = 5
# Web searches offered after the results; "%s" is the query. Optional
# `top_hit_label` repeats the best result first under that heading.
web_label = "Web"
web = [
    { label = "Search the web for “%s”", address = "https://duckduckgo.com/?q=%s", icon = "web-browser" },
]

[notifications]
# Banner time, unless the sender asks for its own.
banner_seconds = 5
# Wording of the notification list; %1 is a number.
list_title = "Notifications"
none_label = "No notifications"
time_now = "now"
time_minutes = "%1 min ago"
time_hours = "%1 h ago"

[dock]
groups = [[{ name = "Applications", icon = "view-app-grid", shell = "app_grid" }, { name = "Home", icon = "user-home", folder = "~", view = "list", order = "name" }, "foot", "mavernix-settings"], [{ name = "Downloads", icon = "folder-download", folder = "~/Downloads", view = "list", order = "added" }]]
magnification = false
autohide = false
settings_command = ["mavernix-settings", "dock"]
trash = true
trash_label = "Wastebasket"
trash_command = ["gio", "open", "trash:///"]
# Run with the paths of files dropped onto the trash.
trash_drop_command = ["gio", "trash"]

# Initial view of a folder dropped onto the dock: "fan", "grid" or "list".
new_folder_view = "list"

[dock.trash_empty]
command = ["gio", "trash", "--empty"]
confirm = { title = "Delete everything in the wastebasket for good?", text = "This cannot be undone.", button = "Delete", cancel = "Cancel", icon = "user-trash-full" }

# Wording of the dock's menus; %1 is a window's title.
[dock.words]
options = "Options"
keep = "Keep in dock"
remove = "Remove from dock"
open = "Open"
open_named = "Show “%1”"
quit = "Quit"
empty_trash = "Empty wastebasket"
magnification_on = "Enlarge icons under the pointer"
magnification_off = "Do not enlarge icons"
settings = "Dock settings…"
sort_by = "Sort by"
sort_name = "Name"
sort_added = "Date added"
sort_modified = "Date modified"
sort_created = "Date created"
sort_kind = "Kind"
view_as = "Show contents as"
view_fan = "Column"
view_grid = "Grid"
view_list = "List"
open_in_file_manager = "Open folder"
more_in_file_manager = "%1 more"

[desktop_files]
# Files of a folder shown as icons on the desktop.
show = true
folder = "~/Desktop"
# Launchers placed on the desktop once, at a user's first login.
place_once = ["mavernix-theme-installer"]
# File actions, each given the paths. A command left out removes its menu
