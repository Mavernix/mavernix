cancel = "Cancel"
icon = "dialog-password"

[idle]
# Idle times before locking, screen blanking and sleep; 0 means never. Idle
# inhibitors (video, calls) are respected.
lock_after_seconds = 600
screen_off_after_seconds = 600
sleep_after_seconds = 0
lock_before_sleep = true

[power]
# Closing the lid: "sleep" leaves it to the system (logind's
# HandleLidSwitch, usually sleep), "lock" only locks the screen, "nothing"
# does nothing. Needs UPower to see the lid.
lid_closed = "sleep"

[session]
# Reload the shell when its files change on disk (for development).
reload_shell_on_change = false
# Programs started with the desktop; missing ones are skipped.
autostart = [["nm-applet", "--indicator"]]
# Also start ~/.config/autostart entries (needs `dex`).
users_autostart = true

[commands]
# Keys that run a command, bound in the compositor so they work even when
# the shell does not. end_session ends it without asking.
terminal = { key = "<super> KEY_ENTER", run = ["foot"] }
end_session = { key = "<ctrl> <alt> KEY_BACKSPACE", run = ["sh", "-c", "kill \"$DESKTOP_SESSION_PID\""] }
# Brightness (needs `brightnessctl`) and media keys (needs `playerctl`).
brightness_up = { key = "KEY_BRIGHTNESSUP", run = ["brightnessctl", "set", "+5%"], repeat = true }
brightness_down = { key = "KEY_BRIGHTNESSDOWN", run = ["brightnessctl", "set", "5%-"], repeat = true }
play_pause = { key = "KEY_PLAYPAUSE", run = ["playerctl", "play-pause"] }
next_track = { key = "KEY_NEXTSONG", run = ["playerctl", "next"] }
previous_track = { key = "KEY_PREVIOUSSONG", run = ["playerctl", "previous"] }
# Screenshots to the desktop (needs `grim`, and `slurp` for a part).
screenshot = { key = "KEY_SYSRQ", run = ["sh", "-c", "grim \"$HOME/Desktop/Screenshot $(date +'%Y-%m-%d at %H.%M.%S').png\" && mavernix-sound screen-capture"] }
screenshot_part = { key = "<shift> KEY_SYSRQ", run = ["sh", "-c", "grim -g \"$(slurp)\" \"$HOME/Desktop/Screenshot $(date +'%Y-%m-%d at %H.%M.%S').png\" && mavernix-sound screen-capture"] }
