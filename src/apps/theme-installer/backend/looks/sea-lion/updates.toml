# What has changed in the Sea Lion themes since the first release, oldest
# first. Each update counts `revision` up by one. The themes an import makes
# record the newest revision as [theme] revision (import_theme.py); themes
# imported before this list existed have none, which counts as 0.
#
# settings        Theme keys that need nothing new from the installer. At
#                 login, older themes get the ones they lack
#                 (src/session/refresh_themes.py), so nobody has to import
#                 again for them.
# import_brings   What only a new import gives, because it takes new files
#                 from the installer: one sentence each, as the Theme
#                 Installer lists them when it offers the new import. A
#                 feature that only looks better with those files works
#                 without them, with a stand-in; one that cannot work at all
#                 stays off until the new import.

[[update]]
revision = 1
import_brings = ["The Applications folder in the dock gets its own icon."]

[update.settings."dock.folder.grid"]
stage_share = 0.8
fit_spacing = 28

# The window that offers the new import, which older themes need first.
[update.settings.theme_installer]
news_width = 668
news_icon_size = 64
news_item_gap = 4
