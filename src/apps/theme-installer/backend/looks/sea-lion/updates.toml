[[update]]
revision = 4
import_brings = [
    "Every Mavericks program and System Preferences pane brings its icon, so App Icons can give any program one of them.",
    "More programs get Mavericks' icons, such as Thunderbird, VLC and Spectacle, and so do the Mouse, Keyboard and Network panes in System Preferences.",
]

[[update]]
revision = 5

# Menus blink the chosen item and fade out as they close.
[update.settings."animation.menu_close"]
kind = "fade"
duration_ms = 130
blink_ms = 60

# Windows open with a pop, from a little smaller, as on OS X, instead of
# Wayfire's zoom from a third of their size.
[[update.corrections]]
table = "animation.window_open"
key = "kind"
was = "zoom"
now = "pop"

[[update.corrections]]
table = "animation.window_open"
key = "curve"
was = "linear"
now = "ease-out"

# The application grid's icons settle into place from a little larger, as
# Launchpad's do.
[[update.corrections]]
table = "animation.app_grid"
key = "kind"
was = "fade"
now = "zoom"

# System Preferences grows or shrinks to the pane it switches to, as on
# OS X, while the pane left behind fades.
[update.settings."animation.settings_page"]
kind = "resize"
duration_ms = 200

# The list of notifications opens as Notification Center does: the desktop
# slides aside and uncovers it.
[[update.corrections]]
table = "animation.notification_list"
key = "kind"
was = "slide"
now = "push"

