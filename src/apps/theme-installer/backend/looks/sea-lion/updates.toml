# What has changed in the Sea Lion themes since the first release, oldest
# first. Each update counts `revision` up by one. The themes an import makes
# record the newest revision as [theme] revision; themes imported before this
# list existed have none, which counts as 0. How the list is used is in
# backend/updates.py.
#
# settings        Theme keys that need nothing new from the installer. At
#                 login, older themes get the ones they lack, once, so
#                 nobody has to import again for them.
# import_brings   What only a new import gives, because it takes new files
#                 from the installer: one sentence each, as the Theme
#                 Installer lists them when it offers the new import. A
#                 feature that only looks better with those files works
#                 without them, with a stand-in; one that cannot work at all
#                 stays off until the new import.
# corrections     Values an older import wrote that this version changes:
#                 each replaces `was` with `now`, but only where the theme
#                 still holds `was`, so a value changed by hand stays.
# themes          Optional: the themes that get this update's settings and
#                 corrections, when they aren't for all of them (Sea Lion
#                 Dark needs dark values where Sea Lion has light ones).

[[update]]
revision = 1
import_brings = [
    "The Applications folder in the dock gets its own icon.",
    "Folders inside it, such as Utilities, get their own icon and Mavericks' back button.",
    "Folders in the dock show Mavericks' thin scroll bar while they scroll.",
]

[update.settings."dock.folder.grid"]
stage_share = 0.8
fit_spacing = 28
selection = { gradient = ["#ffffffc4", "#ffffff33"], radius = 5 }
scroll_fade = 10
scroll_snap_ms = 230
scroll_snap_curve = "linear"
scroll_bar_width = 7
scroll_bar_inset = 6
scroll_bar_fade_ms = 300
label_expanded = { fill = { gradient = ["#dbdbdb", "#a5a5a5"], radius = 9 }, text_color = "#000000", height = 18, padding = 9 }
# Where the back button goes; its picture comes with a new import.
back_button = { left = 7, top = 5 }

# A folder's list in the dock: icons, and scrolling when it is taller than the room.
[update.settings."dock.menu"]
icon_size = 16
icon_gap = 4
icon_item_height = 21
scroll_arrow_height = 19
scroll_speed = 100
top_margin = 5

[[update.corrections]]
table = "dock.folder.grid"
key = "icon_size"
was = 96
now = 100

# The window that offers the new import, which older themes need first.
[update.settings.theme_installer]
news_width = 668
news_icon_size = 64
news_item_gap = 4

