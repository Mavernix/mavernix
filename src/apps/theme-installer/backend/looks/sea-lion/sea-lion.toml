# The Sea Lion desktop: the plain desktop with Sea Lion's layout, keys and
# words, and the Sea Lion theme, which the Theme Installer makes. Only what
# differs from
# plain.toml is here; what you change while using it is shared with plain.

based_on = "plain"
theme = "sea-lion"

[window]
button_side = "left"
button_order = ["close", "minimize", "maximize"]
joined_tool_bar_apps = ["mavernix-settings", "org.kde.dolphin", "org.kde.konsole"]
quick_open_close_ms = 120

[panel]
left = ["logo", "app_name", "menus"]
right = ["tray", "bluetooth", "volume", "network", "battery", "clock", "search", "notifications"]
quit_label = "Quit %1"
logo_menu = [
    { label = "About This PC", command = ["mavernix-about"] },
    { separator = true },
    { label = "System Preferences…", command = ["mavernix-settings"] },
    { separator = true },
    { label = "Sleep", command = ["systemctl", "suspend"] },
    { label = "Restart…", command = ["systemctl", "reboot"], confirm = { title = "Are you sure you want to restart your computer now?", text = "If you do nothing, the computer will restart automatically in %1 seconds.", button = "Restart", cancel = "Cancel", icon = "system-reboot", seconds = 60 } },
    { label = "Shut Down…", command = ["systemctl", "poweroff"], confirm = { title = "Are you sure you want to shut down your computer now?", text = "If you do nothing, the computer will shut down automatically in %1 seconds.", button = "Shut Down", cancel = "Cancel", icon = "system-shutdown", seconds = 60 } },
    { separator = true },
    { label = "Lock Screen", action = "lock" },
    { label = "Log Out…", command = ["sh", "-c", "kill \"$DESKTOP_SESSION_PID\""], confirm = { title = "Are you sure you want to quit all applications and log out now?", text = "If you do nothing, you will be logged out automatically in %1 seconds.", button = "Log Out", cancel = "Cancel", icon = "system-log-out", seconds = 60 } },
]
clock_format = "ddd h:mm AP"
clock_menu_date_format = "dddd, MMMM d, yyyy"

# The first menu opens from the desktop's name, plain's "Desktop" unless it
# is changed in System Preferences, Desktop.
[[desktop_menus.menus]]
entries = [
    { label = "System Preferences…", command = ["mavernix-settings", "desktop"] },
    { separator = true },
    { label = "Empty Trash…", action = "empty_trash" },
]

[[desktop_menus.menus]]
title = "File"
entries = [
    { label = "New Window", command = ["gio", "open", "~"] },
    { label = "New Folder", command = ["mavernix-file-action", "new-folder", "~/Desktop", "untitled folder"] },
    { separator = true },
    { label = "Find", action = "search" },
]

[[desktop_menus.menus]]
title = "Go"
entries = [
    { label = "Home", command = ["gio", "open", "~"] },
    { label = "Desktop", command = ["gio", "open", "~/Desktop"] },
    { label = "Documents", command = ["gio", "open", "~/Documents"] },
    { label = "Downloads", command = ["gio", "open", "~/Downloads"] },
    { label = "Pictures", command = ["gio", "open", "~/Pictures"] },
    { separator = true },
    { label = "Applications", action = "app_grid" },
    { label = "Trash", command = ["gio", "open", "trash:///"] },
]

[[desktop_menus.menus]]
title = "Window"
entries = [
    { label = "All Windows", action = "window_overview" },
]

[shortcuts]
app_grid = "KEY_F4"
window_overview = "KEY_F3 | <ctrl> KEY_UP"
show_desktop = "KEY_F11"
close_window = "<super> KEY_Q"
switch_window = "<super> KEY_GRAVE"
minimize_window = "<super> KEY_M"
fullscreen_window = "<ctrl> <super> KEY_F"
lock = "<ctrl> <super> KEY_L"
tile_top_left = "<ctrl> <alt> KEY_U"
tile_top_right = "<ctrl> <alt> KEY_I"
tile_bottom_left = "<ctrl> <alt> KEY_J"
tile_bottom_right = "<ctrl> <alt> KEY_K"
# Not Ctrl+arrows as on the original: there those move by words in text
# fields on Linux, which the Mac does with Option.
previous_desktop = "<ctrl> <alt> KEY_LEFT"
next_desktop = "<ctrl> <alt> KEY_RIGHT"

[desktops]
count = 1
still = ["dock"]
slides_as_two = ["panel"]

[gestures]
swipe_up_4 = "window_overview"
pinch_out_4 = "show_desktop"

[window_overview]
desktop_name = "Desktop"
desktop_numbered_name = "Desktop %1"

[screenshot]
flash = false

[search]
top_hit_label = "Top Hit"
web_label = "Web Searches"
web = [
    { label = "Search Web for “%s”", address = "https://www.google.com/search?q=%s", icon = "web-browser" },
    { label = "Search Wikipedia for “%s”", address = "https://en.wikipedia.org/wiki/Special:Search?search=%s", icon = "web-browser" },
]

[notifications]
none_label = "No New Notifications"
time_minutes = "%1m ago"
time_hours = "%1h ago"

[dock]
groups = [
    [
        { name = "Home", icon = "user-home", folder = "~", view = "list", order = "name" },
        { name = "App Grid", icon = "view-app-grid", shell = "app_grid" },
        "foot",
        "mavernix-settings",
    ],
    [
        { name = "Applications", icon = "folder-applications", programs = true, view = "grid" },
        { name = "Downloads", icon = "folder-download", folder = "~/Downloads", view = "fan", order = "added" },
    ],
]
last_group_at_end = true
trash_label = "Trash"
new_folder_view = "fan"
# A program's own menu entries only while it runs, as on the original.
actions_when_closed = false

[dock.trash_empty.confirm]
title = "Are you sure you want to permanently erase the items in the Trash?"
text = "You can’t undo this action."
button = "Empty Trash"

