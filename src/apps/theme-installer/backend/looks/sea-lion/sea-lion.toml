[input]
keyboard_switch_key = "ctrl_space"
tap_to_click = false
natural_scroll = true
secondary_click = "two_fingers"

[commands.screenshot]
key = "<super> <shift> KEY_3"
run = [
    "sh",
    "-c",
    "grim \"$HOME/Desktop/Screen Shot $(date +'%Y-%m-%d at %H.%M.%S').png\" && mavernix-sound screen-capture",
]

[commands.screenshot_part]
key = "<super> <shift> KEY_4"
run = [
    "sh",
    "-c",
    "grim -g \"$(slurp)\" \"$HOME/Desktop/Screen Shot $(date +'%Y-%m-%d at %H.%M.%S').png\" && mavernix-sound screen-capture",
]

[commands.screenshot_to_clipboard]
key = "<ctrl> <super> <shift> KEY_3"
run = ["sh", "-c", "grim - | wl-copy --type image/png && mavernix-sound screen-capture"]

[commands.screenshot_part_to_clipboard]
key = "<ctrl> <super> <shift> KEY_4"
run = [
    "sh",
    "-c",
    "grim -g \"$(slurp)\" - | wl-copy --type image/png && mavernix-sound screen-capture",
]

