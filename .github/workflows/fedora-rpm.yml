name: Fedora RPM

on:
  workflow_dispatch:
  push:
    branches: [fedora-rpm]
    paths:
      - '.github/workflows/fedora-rpm.yml'
      - 'packaging/fedora/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wf-config:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install RPM tools
        run: dnf install -y git rpm-build rpmdevtools dnf5-plugins
      - uses: actions/checkout@v4
      - name: Prepare sources
        run: |
          mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/wf-config.spec /root/rpmbuild/SPECS/
          spectool -g -C /root/rpmbuild/SOURCES /root/rpmbuild/SPECS/wf-config.spec
      - name: Install build dependencies
        run: dnf builddep -y /root/rpmbuild/SPECS/wf-config.spec
      - name: Build and test RPMs
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/wf-config.spec
      - name: Test package installation
        run: |
          dnf install -y /root/rpmbuild/RPMS/x86_64/wf-config-0*.rpm /root/rpmbuild/RPMS/x86_64/wf-config-devel-*.rpm
          test "$(pkg-config --modversion wf-config)" = 0.11.0
      - name: Upload RPMs
        uses: actions/upload-artifact@v4
        with:
          name: wf-config-fedora-44
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 7

  wayfire:
    needs: wf-config
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 45
    steps:
      - name: Install RPM tools
        run: dnf install -y git tar gzip rpm-build rpmdevtools dnf5-plugins
      - uses: actions/checkout@v4
      - name: Download wf-config RPMs
        uses: actions/download-artifact@v4
        with:
          name: wf-config-fedora-44
          path: dependencies
      - name: Install wf-config
        run: dnf install -y dependencies/RPMS/x86_64/wf-config-0*.rpm dependencies/RPMS/x86_64/wf-config-devel-*.rpm
      - name: Prepare Wayfire sources
        run: |
          mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/wayfire.spec /root/rpmbuild/SPECS/
          git clone --depth 1 --branch v0.11.0 https://github.com/WayfireWM/wayfire.git /tmp/wayfire-0.11.0
          test "$(git -C /tmp/wayfire-0.11.0 rev-parse HEAD)" = d39902379c5737eebe1dc3a830659fa3f0fa22e0
          git -C /tmp/wayfire-0.11.0 submodule update --init subprojects/wf-json subprojects/wf-utils subprojects/wf-touch
          tar --exclude-vcs -czf /root/rpmbuild/SOURCES/wayfire-0.11.0.tar.gz -C /tmp wayfire-0.11.0
      - name: Install build dependencies
        run: dnf builddep -y /root/rpmbuild/SPECS/wayfire.spec
      - name: Build and test Wayfire RPMs
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/wayfire.spec
      - name: Test package installation
        run: |
          dnf install -y /root/rpmbuild/RPMS/x86_64/wayfire-0*.rpm /root/rpmbuild/RPMS/x86_64/wayfire-devel-*.rpm
          test "$(pkg-config --modversion wayfire)" = 0.11.0
          wayfire --version
      - name: Upload RPMs and source RPM
        uses: actions/upload-artifact@v4
        with:
          name: wayfire-fedora-44
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 7

  mavernix:
    needs: [wf-config, wayfire]
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 45
    steps:
      - name: Install RPM tools
        run: dnf install -y git rpm-build rpmdevtools dnf5-plugins
      - uses: actions/checkout@v4
      - name: Download wf-config RPMs
        uses: actions/download-artifact@v4
        with:
          name: wf-config-fedora-44
          path: dependencies/wf-config
      - name: Download Wayfire RPMs
        uses: actions/download-artifact@v4
        with:
          name: wayfire-fedora-44
          path: dependencies/wayfire
      - name: Install our build dependencies
        run: |
          mapfile -t packages < <(find dependencies -type f \( -name 'wf-config-0*.x86_64.rpm' -o -name 'wf-config-devel-*.x86_64.rpm' -o -name 'wayfire-0*.x86_64.rpm' -o -name 'wayfire-devel-*.x86_64.rpm' \))
          test "${#packages[@]}" -eq 4
          dnf install -y "${packages[@]}"
          test "$(pkg-config --modversion wayfire)" = 0.11.0
      - name: Prepare Mavernix sources
        run: |
          mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/mavernix.spec /root/rpmbuild/SPECS/
          spectool -g -C /root/rpmbuild/SOURCES /root/rpmbuild/SPECS/mavernix.spec
      - name: Install build dependencies
        run: dnf builddep -y /root/rpmbuild/SPECS/mavernix.spec
      - name: Build and test Mavernix RPMs
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/mavernix.spec
      - name: Inspect runtime requirements
        run: rpm -qp --requires /root/rpmbuild/RPMS/x86_64/mavernix-0*.rpm
      - name: Upload RPMs and source RPM
        uses: actions/upload-artifact@v4
        with:
          name: mavernix-fedora-44
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 7


  quickshell:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install RPM tools
        run: dnf install -y git rpm-build rpmdevtools dnf5-plugins
      - uses: actions/checkout@v4
      - name: Prepare Quickshell sources
        run: |
          mkdir -p /root/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/quickshell.spec /root/rpmbuild/SPECS/
          spectool -g -C /root/rpmbuild/SOURCES /root/rpmbuild/SPECS/quickshell.spec
      - name: Install build dependencies
        run: dnf builddep -y /root/rpmbuild/SPECS/quickshell.spec
      - name: Build and test Quickshell RPMs
        run: rpmbuild --define '_topdir /root/rpmbuild' -ba /root/rpmbuild/SPECS/quickshell.spec
      - name: Upload RPMs and source RPM
        uses: actions/upload-artifact@v4
        with:
          name: quickshell-fedora-44
          path: |
            /root/rpmbuild/RPMS/**/*.rpm
            /root/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
          retention-days: 7

  install-test:
    needs: [wf-config, wayfire, mavernix, quickshell]
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download built RPMs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-fedora-44'
          path: packages
      - name: Select the four runtime packages
        run: |
          mkdir runtime-rpms
          mapfile -t packages < <(find packages -type f \( -name 'wf-config-0*.x86_64.rpm' -o -name 'wayfire-0*.x86_64.rpm' -o -name 'quickshell-0*.x86_64.rpm' -o -name 'mavernix-0*.x86_64.rpm' \))
          test "${#packages[@]}" -eq 4
          cp "${packages[@]}" runtime-rpms/
      - name: Install together in a clean Fedora container
        run: dnf install -y ./runtime-rpms/*.rpm
      - name: Verify installed packages and commands
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          rpm -q wf-config wayfire quickshell mavernix
          quickshell --version
          wayfire --version
          test -f /usr/share/wayland-sessions/mavernix.desktop
          test -d /usr/share/mavernix
      - name: Collect matching sources and build instructions
        run: |
          mkdir -p source-rpms/build-instructions
          mapfile -t sources < <(find packages -type f -name '*.src.rpm')
          test "${#sources[@]}" -eq 4
          cp "${sources[@]}" source-rpms/
          cp .github/workflows/fedora-rpm.yml source-rpms/build-instructions/
          cp -r packaging/fedora source-rpms/build-instructions/
          cp packaging/fedora/README.md runtime-rpms/README.md
          cp packaging/fedora/README.md source-rpms/README.md
          (cd source-rpms && sha256sum *.src.rpm > SHA256SUMS)
      - name: Upload matching source package set
        uses: actions/upload-artifact@v4
        with:
          name: mavernix-fedora-44-sources
          path: source-rpms/
          if-no-files-found: error
          retention-days: 7
      - name: Generate download checksums
        working-directory: runtime-rpms
        run: sha256sum *.rpm > SHA256SUMS
      - name: Upload installable runtime package set
        uses: actions/upload-artifact@v4
        with:
          name: mavernix-fedora-44-runtime
          path: runtime-rpms/
          if-no-files-found: error
          retention-days: 7
